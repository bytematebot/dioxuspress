name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # A release tagged v0.1.1 that ships 0.1.0 would publish the wrong crate under
      # the right name, and neither is reversible once it lands.
      - name: The tag and the manifest must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "dioxus-press") | .version')
          echo "tag=$tag manifest=$manifest"
          [ "$tag" = "$manifest" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml $manifest"
            exit 1
          }

      - run: cargo test
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
